[project]
name = "krnn"
version = "0.1.0"
description = "Koopman/spectral analysis of RNN hidden-state dynamics"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Riccardo Tancredi" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krnn"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
